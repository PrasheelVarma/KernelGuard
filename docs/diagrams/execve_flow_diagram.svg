<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="900" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">execve() Interception — Flow</text>

  <!-- Start -->
  <rect x="330" y="70" width="240" height="55" rx="27" fill="#4338ca"/>
  <text x="450" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Process calls execve()</text>

  <line x1="450" y1="125" x2="450" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Kernel intercept -->
  <rect x="270" y="160" width="360" height="65" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Kernel invokes attached kprobe</text>
  <text x="450" y="207" text-anchor="middle" font-size="12" fill="#7f1d1d">before the syscall completes</text>

  <line x1="450" y1="225" x2="450" y2="260" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- trace_execve runs -->
  <rect x="240" y="260" width="420" height="90" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1a202c">trace_execve(ctx) runs in kernel space</text>
  <text x="450" y="308" text-anchor="middle" font-size="12" fill="#4b5563">bpf_get_current_pid_tgid() → PID</text>
  <text x="450" y="326" text-anchor="middle" font-size="12" fill="#4b5563">bpf_get_current_comm() → process name</text>

  <line x1="450" y1="350" x2="450" y2="385" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Week 2 decision -->
  <polygon points="450,385 590,440 450,495 310,440" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="435" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">Target PID set?</text>
  <text x="450" y="452" text-anchor="middle" font-size="11" fill="#78350f">(Week 2 — PID filtering)</text>

  <line x1="310" y1="440" x2="180" y2="440" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="245" y="430" text-anchor="middle" font-size="11" fill="#374151">no</text>
  <rect x="30" y="410" width="150" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="105" y="435" text-anchor="middle" font-size="12" fill="#374151">Trace all</text>
  <text x="105" y="452" text-anchor="middle" font-size="12" fill="#374151">processes</text>

  <line x1="450" y1="495" x2="450" y2="530" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="465" y="515" font-size="11" fill="#374151">yes → filtered PID matches</text>

  <!-- Emit event -->
  <rect x="270" y="530" width="360" height="65" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="558" text-anchor="middle" font-size="14" font-weight="600" fill="#1a202c">bpf_trace_printk() emits event</text>
  <text x="450" y="577" text-anchor="middle" font-size="12" fill="#4b5563">written to kernel trace pipe</text>

  <line x1="450" y1="595" x2="450" y2="630" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Python reads -->
  <rect x="240" y="630" width="420" height="80" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="660" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">ExecveController.events()</text>
  <text x="450" y="680" text-anchor="middle" font-size="12" fill="#4b5563">reads trace_fields(), yields structured dict</text>
  <text x="450" y="698" text-anchor="middle" font-size="12" fill="#4b5563">(pid, task, message, timestamp, cpu)</text>

  <line x1="450" y1="710" x2="450" y2="745" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Decision: policy enforcement -->
  <polygon points="450,745 610,805 450,865 290,805" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="800" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">Policy allows?</text>
  <text x="450" y="817" text-anchor="middle" font-size="11" fill="#78350f">(Week 3 — enforcement)</text>

  <line x1="610" y1="805" x2="740" y2="805" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="675" y="795" text-anchor="middle" font-size="11" fill="#374151">no</text>
  <rect x="740" y="775" width="130" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="805" y="800" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">Block</text>
  <text x="805" y="817" text-anchor="middle" font-size="11" fill="#7f1d1d">-EPERM</text>

  <line x1="290" y1="805" x2="160" y2="805" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="225" y="795" text-anchor="middle" font-size="11" fill="#374151">yes</text>
  <rect x="30" y="775" width="130" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="95" y="800" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Log &amp;</text>
  <text x="95" y="817" text-anchor="middle" font-size="11" fill="#14532d">continue</text>

</svg>
